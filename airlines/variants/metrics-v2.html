<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metrics Variant B — DRCT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --dark:    #1b2733;
    --blue:    #2a8aea;
    --font-sans: 'IBM Plex Sans', 'Roboto', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  body {
    font-family: var(--font-sans);
    background: #fff;
    color: var(--dark);
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1010px;
    margin: 0 auto;
    padding: 0 32px;
  }

  /* ── Variant B label ── */
  .variant-label {
    text-align: center;
    padding: 20px 0 0;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(27,39,51,0.35);
  }

  /* ── Metrics ── */
  .metrics {
    padding: 104px 0 116px;
  }
  .metrics__grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
  }
  .metrics__col {
    padding: 0 72px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .metrics__col:first-child { padding-left: 0; }
  .metrics__col:last-child  { padding-right: 0; }
  .metrics__col + .metrics__col {
    border-left: 1px solid rgba(27,39,51,0.08);
  }
  .metrics__badge-pre {
    display: block;
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: var(--blue);
    opacity: 0.7;
    margin-bottom: 0;
    line-height: 1;
  }
  .metrics__value {
    display: block;
    font-size: 116px;
    font-weight: 900;
    color: var(--blue);
    line-height: 1;
    letter-spacing: -4px;
    margin-bottom: 14px;
  }
  .metrics__value sup {
    font-size: 54px;
    letter-spacing: 0;
    vertical-align: super;
  }
  .metrics__label {
    font-size: 13px;
    font-weight: 600;
    color: rgba(27,39,51,0.6);
    line-height: 1.3;
    letter-spacing: 0.1px;
  }
</style>
</head>
<body>
<p class="variant-label">Variant B — No descriptions</p>
<div class="wrap">
  <section class="metrics" id="metrics">
    <div class="metrics__grid">

      <div class="metrics__col">
        <span class="metrics__value">40<sup>+</sup></span>
        <span class="metrics__label">Connected Airlines</span>
      </div>

      <div class="metrics__col">
        <span class="metrics__value">100s</span>
        <span class="metrics__label">Travel Sellers</span>
      </div>

      <div class="metrics__col">
        <span class="metrics__badge-pre">IATA</span>
        <span class="metrics__value">ARM</span>
        <span class="metrics__label">Certified System Provider</span>
      </div>

    </div>
  </section>
</div>
</body>
</html>
