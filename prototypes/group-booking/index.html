<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRCT — Group Booking Flow Prototype</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header">
  <div class="app-header__logo">
    <img src="assets/logos/drct-logo.png" alt="DRCT">
  </div>
  <nav class="app-header__nav">
    <span class="app-header__link" id="navSearch">Search</span>
    <span class="app-header__link" id="navBookings">Bookings</span>
    <span class="app-header__link is-disabled" title="Not available in this prototype">Management</span>
    <span class="app-header__link is-disabled" title="Not available in this prototype">Sales</span>

    <span class="app-header__link is-disabled" title="Not available in this prototype">Profile</span>

<main class="page" id="main"></main>

<div id="stickyBarHost"></div>

<script src="script.js"></script>
