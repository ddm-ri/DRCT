<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600">
  <defs>
    <!-- Deep crimson-to-dark sky gradient -->
    <linearGradient id="ekSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A0204"/>
      <stop offset="30%" stop-color="#4A0608"/>
      <stop offset="65%" stop-color="#8A0B11"/>
      <stop offset="100%" stop-color="#C8111A"/>
    </linearGradient>
    <!-- Desert golden horizon glow -->
    <radialGradient id="ekGlow" cx="50%" cy="88%" r="65%">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.65"/>
      <stop offset="35%" stop-color="#E8751A" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
    <!-- Aircraft body gradient -->
    <linearGradient id="ekBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F0DFDE"/>
      <stop offset="100%" stop-color="#C09090"/>
    </linearGradient>
    <!-- Aircraft shadow -->
    <linearGradient id="ekShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A06060"/>
      <stop offset="100%" stop-color="#602020"/>
    </linearGradient>
    <!-- Wing gradient -->
    <linearGradient id="ekWing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0E8E8"/>
      <stop offset="100%" stop-color="#A07070"/>
    </linearGradient>
    <!-- Cloud filter -->
    <filter id="ekCloudBlur">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="ekStarGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="880" height="600" fill="url(#ekSky)"/>

  <!-- Stars -->
  <g opacity="0.65" filter="url(#ekStarGlow)">
    <circle cx="70" cy="40" r="1.1" fill="white" opacity="0.8"/>
    <circle cx="140" cy="20" r="0.9" fill="white" opacity="0.6"/>
    <circle cx="210" cy="55" r="1.3" fill="white" opacity="0.7"/>
    <circle cx="310" cy="18" r="1" fill="white" opacity="0.6"/>
    <circle cx="390" cy="45" r="0.9" fill="white" opacity="0.7"/>
    <circle cx="470" cy="28" r="1.1" fill="white" opacity="0.8"/>
    <circle cx="550" cy="60" r="0.9" fill="white" opacity="0.6"/>
    <circle cx="630" cy="15" r="1.2" fill="white" opacity="0.7"/>
    <circle cx="710" cy="42" r="0.9" fill="white" opacity="0.8"/>
    <circle cx="790" cy="25" r="1" fill="white" opacity="0.6"/>
    <circle cx="850" cy="65" r="0.8" fill="white" opacity="0.5"/>
    <circle cx="170" cy="90" r="0.8" fill="white" opacity="0.4"/>
    <circle cx="420" cy="105" r="0.9" fill="white" opacity="0.5"/>
    <circle cx="700" cy="80" r="0.7" fill="white" opacity="0.4"/>
  </g>

  <!-- Desert golden horizon glow -->
  <ellipse cx="440" cy="570" rx="530" ry="220" fill="url(#ekGlow)"/>

  <!-- Atmospheric desert haze layer -->
  <rect x="0" y="520" width="880" height="80" fill="#C8111A" opacity="0.15"/>
  <rect x="0" y="550" width="880" height="50" fill="#F5A623" opacity="0.10"/>

  <!-- Thin desert-heat shimmer clouds (very low) -->
  <g opacity="0.14" filter="url(#ekCloudBlur)">
    <ellipse cx="180" cy="490" rx="200" ry="20" fill="white"/>
    <ellipse cx="660" cy="470" rx="240" ry="16" fill="white"/>
    <ellipse cx="430" cy="510" rx="260" ry="18" fill="white"/>
  </g>

  <!-- === EMIRATES AIRCRAFT (A380-style, wide-body) === -->
  <g transform="translate(80, 110) rotate(-3.5, 400, 255)">

    <!-- Double-deck fuselage (A380 profile — slightly taller) -->
    <path d="M 105,242
             C 105,224 120,212 145,208
             L 565,198
             C 598,198 626,208 644,230
             L 658,255
             C 658,267 650,278 640,283
             L 565,292
             L 145,302
             C 120,298 105,264 105,242 Z"
          fill="url(#ekBody)" opacity="0.97"/>

    <!-- Upper deck (A380 characteristic hump) -->
    <path d="M 200,208
             L 540,198
             C 562,198 578,202 582,208
             L 582,228
             L 540,228
             L 200,232
             C 180,232 172,228 172,222
             Z"
          fill="#F0E8E8" opacity="0.5"/>

    <!-- Fuselage belly shadow -->
    <path d="M 145,280 L 565,272 L 640,280 L 565,292 L 145,302 Z"
          fill="url(#ekShadow)" opacity="0.55"/>

    <!-- Nose -->
    <path d="M 105,242
             C 100,240 78,242 48,244
             C 36,244 20,247 8,252
             C 18,256 36,258 48,258
             C 78,258 100,256 105,254 Z"
          fill="url(#ekBody)" opacity="0.95"/>

    <!-- Cockpit windows -->
    <path d="M 88,238 C 82,236 70,239 64,243 L 64,248 C 70,250 82,250 88,250 Z"
          fill="#8A1A1A" opacity="0.7"/>

    <!-- Windows row (upper deck) -->
    <g opacity="0.65">
      <rect x="215" y="213" width="9" height="8" rx="2" fill="#F8D8D8"/>
      <rect x="240" y="212" width="9" height="8" rx="2" fill="#F8D8D8"/>
      <rect x="265" y="211" width="9" height="8" rx="2" fill="#F8D8D8"/>
      <rect x="290" y="211" width="9" height="8" rx="2" fill="#F8D8D8"/>
      <rect x="315" y="210" width="9" height="8" rx="2" fill="#F8D8D8"/>
      <rect x="340" y="210" width="9" height="8" rx="2" fill="#F8D8D8"/>
      <rect x="365" y="209" width="9" height="8" rx="2" fill="#F8D8D8"/>
      <rect x="390" y="209" width="9" height="8" rx="2" fill="#F8D8D8"/>
      <rect x="415" y="208" width="9" height="8" rx="2" fill="#F8D8D8"/>
      <rect x="440" y="208" width="9" height="8" rx="2" fill="#F8D8D8"/>
      <rect x="465" y="208" width="9" height="8" rx="2" fill="#F8D8D8"/>
      <rect x="490" y="208" width="9" height="8" rx="2" fill="#F8D8D8"/>
      <rect x="515" y="208" width="9" height="8" rx="2" fill="#F8D8D8"/>
    </g>

    <!-- Windows row (main deck) -->
    <g opacity="0.6">
      <rect x="165" y="226" width="9" height="8" rx="2" fill="#F0D0D0"/>
      <rect x="190" y="225" width="9" height="8" rx="2" fill="#F0D0D0"/>
      <rect x="215" y="225" width="9" height="8" rx="2" fill="#F0D0D0"/>
      <rect x="240" y="224" width="9" height="8" rx="2" fill="#F0D0D0"/>
      <rect x="265" y="224" width="9" height="8" rx="2" fill="#F0D0D0"/>
      <rect x="290" y="223" width="9" height="8" rx="2" fill="#F0D0D0"/>
      <rect x="315" y="223" width="9" height="8" rx="2" fill="#F0D0D0"/>
      <rect x="340" y="222" width="9" height="8" rx="2" fill="#F0D0D0"/>
      <rect x="365" y="222" width="9" height="8" rx="2" fill="#F0D0D0"/>
      <rect x="390" y="221" width="9" height="8" rx="2" fill="#F0D0D0"/>
      <rect x="415" y="221" width="9" height="8" rx="2" fill="#F0D0D0"/>
      <rect x="440" y="221" width="9" height="8" rx="2" fill="#F0D0D0"/>
      <rect x="465" y="221" width="9" height="8" rx="2" fill="#F0D0D0"/>
      <rect x="490" y="220" width="9" height="8" rx="2" fill="#F0D0D0"/>
      <rect x="515" y="220" width="9" height="8" rx="2" fill="#F0D0D0"/>
      <rect x="540" y="220" width="9" height="8" rx="2" fill="#F0D0D0"/>
    </g>

    <!-- Emirates livery stripe (gold-red pinstripe) -->
    <path d="M 145,274 L 640,266" stroke="#F5A623" stroke-width="2.5" opacity="0.9" stroke-linecap="round"/>

    <!-- Main wings (A380 large, swept) -->
    <path d="M 345,262
             L 430,255
             L 390,415
             C 348,448 264,465 155,472
             C 195,440 295,405 345,372
             Z"
          fill="url(#ekWing)" opacity="0.92"/>

    <!-- Wing lower surface -->
    <path d="M 345,272
             L 390,415
             C 348,448 264,465 155,472
             C 200,440 305,408 345,382
             Z"
          fill="#A06060" opacity="0.32"/>

    <!-- Right wing (foreshortened) -->
    <path d="M 388,253
             L 430,251
             L 465,208
             C 490,186 522,172 544,168
             C 522,182 498,196 476,220
             Z"
          fill="url(#ekWing)" opacity="0.68"/>

    <!-- Engine 1 (A380 has 4) -->
    <g transform="translate(300, 368)">
      <ellipse cx="0" cy="0" rx="34" ry="13" fill="#A07070"/>
      <ellipse cx="0" cy="0" rx="30" ry="10" fill="#602020"/>
      <ellipse cx="4" cy="-1" rx="15" ry="6.5" fill="#401010"/>
    </g>
    <!-- Engine 2 -->
    <g transform="translate(232, 400)">
      <ellipse cx="0" cy="0" rx="28" ry="11" fill="#A07070"/>
      <ellipse cx="0" cy="0" rx="24" ry="8" fill="#602020"/>
      <ellipse cx="3" cy="-1" rx="12" ry="5.5" fill="#401010"/>
    </g>

    <!-- Vertical tail stabilizer -->
    <path d="M 602,220
             C 606,202 618,178 626,160
             C 634,156 644,162 648,172
             L 658,215
             L 645,222 Z"
          fill="url(#ekBody)" opacity="0.9"/>

    <!-- Emirates red livery on tail -->
    <path d="M 618,196 L 630,160 L 640,168 L 626,196 Z"
          fill="#EC1B24" opacity="0.9"/>

    <!-- Horizontal tail -->
    <path d="M 584,272 L 646,278 L 688,300 L 672,305 L 642,288 Z"
          fill="url(#ekWing)" opacity="0.85"/>

    <path d="M 604,268 L 646,276 L 668,258 L 654,252 Z"
          fill="url(#ekWing)" opacity="0.58"/>

  </g><!-- /aircraft -->

  <!-- Emirates "E" mark — bottom right corner (stylized) -->
  <g transform="translate(716, 470)">
    <!-- Background tile -->
    <rect width="120" height="100" rx="12" fill="#EC1B24" opacity="0.95"/>
    <!-- Stylized E letterform in gold -->
    <path d="M 30,20 H 90" stroke="#F5A623" stroke-width="6" stroke-linecap="round"/>
    <path d="M 30,20 V 80" stroke="#F5A623" stroke-width="6" stroke-linecap="round"/>
    <path d="M 30,50 H 82" stroke="#F5A623" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 30,80 H 90" stroke="#F5A623" stroke-width="6" stroke-linecap="round"/>
    <!-- Small decorative swoosh above -->
    <path d="M 30,12 Q 60,6 90,12" stroke="rgba(245,166,35,0.45)" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Vignette -->
  <defs>
    <radialGradient id="ekVig" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(15,2,2,0.5)"/>
    </radialGradient>
  </defs>
  <rect width="880" height="600" fill="url(#ekVig)"/>
</svg>