<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1200px;height:1200px;overflow:hidden;font-family:'Inter',sans-serif;background:#F0EDE6;}
/* Centered minimal, stamp style */
.page{width:1200px;height:1200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:80px;}
.stamp{width:100%;background:#fff;border:3px solid #111;border-radius:8px;padding:64px;position:relative;box-shadow:8px 8px 0 #111;}
/* Corner marks */
.cm{position:absolute;width:20px;height:20px;border-color:#111;border-style:solid;}
.cm-tl{top:-3px;left:-3px;border-width:4px 0 0 4px;}
.cm-tr{top:-3px;right:-3px;border-width:4px 4px 0 0;}
.cm-bl{bottom:-3px;left:-3px;border-width:0 0 4px 4px;}
.cm-br{bottom:-3px;right:-3px;border-width:0 4px 4px 0;}

.stamp-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:52px;}
.st-logo{font-size:16px;font-weight:900;color:#111;letter-spacing:3px;text-transform:uppercase;}
.st-badge{background:#FF5F00;color:#fff;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:8px 18px;border-radius:4px;}
.stamp-h1{font-size:96px;font-weight:900;line-height:.88;letter-spacing:-5px;color:#111;margin-bottom:24px;}
.stamp-h1 em{font-style:normal;color:#FF5F00;}
.stamp-rule{height:4px;background:#111;margin:32px 0;}
.stamp-row{display:flex;align-items:center;gap:0;}
.stamp-sub{font-size:28px;font-weight:700;color:#111;flex:1;letter-spacing:-0.5px;}
.stamp-sub span{color:#FF5F00;}
.stamp-date{text-align:right;}
.stamp-date-big{font-size:48px;font-weight:900;color:#FF5F00;letter-spacing:-2px;line-height:1;}
.stamp-date-sub{font-size:14px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:1.5px;}
.stamp-bottom{margin-top:40px;display:flex;align-items:center;gap:20px;}
.sb-btn{background:#111;color:#fff;font-size:18px;font-weight:800;padding:18px 40px;border-radius:6px;flex-shrink:0;}
.sb-details{display:flex;flex-direction:column;gap:4px;flex:1;}
.sb-detail{font-size:15px;color:#666;font-weight:500;}
.sb-detail strong{color:#111;font-weight:700;}
.prize-band{width:100%;background:#FF5F00;border-radius:8px;padding:20px 32px;margin-top:28px;display:flex;align-items:center;gap:12px;}
.pb-icon{font-size:24px;}
.pb-text{font-size:18px;font-weight:700;color:#fff;}
.pb-text em{font-style:normal;color:#FFE08A;}
.pb-ksa{margin-left:auto;font-size:14px;font-weight:700;color:rgba(255,255,255,.7);}
</style></head><body>
<div class="page">
  <div class="stamp">
    <div class="cm cm-tl"></div><div class="cm cm-tr"></div>
    <div class="cm cm-bl"></div><div class="cm cm-br"></div>

    <div class="stamp-top">
      <div class="st-logo">Pegasus Airlines × DRCT</div>
      <div class="st-badge">🇸🇦 KSA Only</div>
    </div>

    <div class="stamp-h1">Pegasus<br><em>NDC</em><br>for KSA</div>
    <div class="stamp-rule"></div>
    <div class="stamp-row">
      <div class="stamp-sub">Live with <span>Pegasus</span> & DRCT</div>
      <div class="stamp-date">
        <div class="stamp-date-big">8 JUL</div>
        <div class="stamp-date-sub">Live Webinar · 2025</div>
      </div>
    </div>

    <div class="stamp-bottom">
      <div class="sb-btn">Register Free →</div>
      <div class="sb-details">
        <div class="sb-detail"><strong>14:00 AST</strong> · Tuesday</div>
        <div class="sb-detail"><strong>Live Q&A</strong> · No slides</div>
        <div class="sb-detail"><strong>Free</strong> for all KSA agents</div>
      </div>
    </div>

    <div class="prize-band">
      <div class="pb-icon">🏆</div>
      <div class="pb-text">Win: <em>2× 500 SAR vouchers</em> + Pegasus round-trip ticket</div>
      <div class="pb-ksa">🇸🇦 Agents only</div>
    </div>
  </div>
</div>
</body></html>
