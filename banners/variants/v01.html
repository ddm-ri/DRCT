<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1200px;height:1200px;overflow:hidden;font-family:'Inter',sans-serif;background:#FF5F00;}
.wrap{width:1200px;height:1200px;display:flex;flex-direction:column;padding:80px;}
.top{display:flex;align-items:center;justify-content:space-between;}
.logo{font-size:20px;font-weight:900;color:#fff;letter-spacing:1px;display:flex;align-items:center;gap:12px;}
.logo-circle{width:44px;height:44px;background:rgba(255,255,255,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;}
.live{background:rgba(0,0,0,0.25);border-radius:100px;padding:10px 22px;font-size:13px;font-weight:700;color:#fff;letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:8px;}
.dot{width:8px;height:8px;border-radius:50%;background:#fff;}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;}
.h1{font-size:112px;font-weight:900;color:#fff;line-height:.92;letter-spacing:-5px;margin-bottom:32px;}
.h1 span{color:rgba(255,255,255,0.35);}
.sub{font-size:32px;font-weight:500;color:rgba(255,255,255,0.75);letter-spacing:-0.5px;}
.sub b{color:#fff;}
.bottom{display:flex;align-items:center;justify-content:space-between;}
.chips{display:flex;gap:16px;}
.chip{background:rgba(0,0,0,0.2);border-radius:14px;padding:16px 24px;color:#fff;}
.chip-label{font-size:11px;font-weight:700;opacity:.6;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px;}
.chip-val{font-size:18px;font-weight:800;}
.btn{background:#fff;color:#FF5F00;font-size:20px;font-weight:900;padding:20px 48px;border-radius:14px;letter-spacing:-0.3px;}
</style></head><body>
<div class="wrap">
  <div class="top">
    <div class="logo"><div class="logo-circle">✈</div>PEGASUS × DRCT</div>
    <div class="live"><div class="dot"></div>LIVE WEBINAR</div>
  </div>
  <div class="mid">
    <div class="h1">Pegasus<br>NDC<br><span>for KSA</span></div>
    <div class="sub">Live with <b>Pegasus</b> & <b>DRCT</b></div>
  </div>
  <div class="bottom">
    <div class="chips">
      <div class="chip"><div class="chip-label">Date</div><div class="chip-val">8 July 2025</div></div>
      <div class="chip"><div class="chip-label">Format</div><div class="chip-val">Live Q&A</div></div>
      <div class="chip"><div class="chip-label">Prize</div><div class="chip-val">2× 500 SAR + ticket</div></div>
    </div>
    <div class="btn">Register Free →</div>
  </div>
</div>
</body></html>
