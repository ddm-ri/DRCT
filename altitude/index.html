<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My requests — Altitude</title>
  <meta name="description" content="Altitude — manage your upgrade and promo code requests in one place.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/my-requests.css">
</head>
<body>

<!-- ================================================================
     HEADER
================================================================ -->
<header class="alt-header" id="altHeader" data-page="requests"></header>

<!-- ================================================================
     MY REQUESTS
================================================================ -->
<main class="alt-main">
  <div class="alt-container">

    <section class="requests" aria-labelledby="requestsTitle">

      <h1 class="requests__title" id="requestsTitle">My requests</h1>

      <div class="requests__body">

        <!-- Filters: request type and request status are two dimensions -->
        <aside class="filters" aria-label="Filters">

          <div class="filters__group">
            <h2 class="filters__title" id="filterTypeTitle">Request type</h2>
            <div class="filters__options" role="group" aria-labelledby="filterTypeTitle" id="typeFilter">
              <button class="filters__option is-active" type="button" aria-pressed="true" data-type="all">
                <span class="filters__label">All</span>
                <span class="filters__count" data-count-type="all">0</span>
              </button>
              <button class="filters__option" type="button" aria-pressed="false" data-type="upgrade">
                <span class="filters__label">Upgrades</span>
                <span class="filters__count" data-count-type="upgrade">0</span>
              </button>
              <button class="filters__option" type="button" aria-pressed="false" data-type="promo">
                <span class="filters__label">Promo codes</span>
                <span class="filters__count" data-count-type="promo">0</span>
              </button>
            </div>
          </div>

          <div class="filters__group">
            <h2 class="filters__title" id="filterStatusTitle">Status</h2>
            <div class="filters__options" role="group" aria-labelledby="filterStatusTitle" id="statusFilter">
              <button class="filters__option is-active" type="button" aria-pressed="true" data-status="all">
                <span class="filters__label">All statuses</span>
                <span class="filters__count" data-count-status="all">0</span>
              </button>
              <button class="filters__option" type="button" aria-pressed="false" data-status="progress">
                <span class="filters__label">In progress</span>
                <span class="filters__count" data-count-status="progress">0</span>
              </button>
              <button class="filters__option" type="button" aria-pressed="false" data-status="action">
                <span class="filters__label">Action required</span>
                <span class="filters__count" data-count-status="action">0</span>
              </button>
              <button class="filters__option" type="button" aria-pressed="false" data-status="done">
                <span class="filters__label">Completed</span>
                <span class="filters__count" data-count-status="done">0</span>
              </button>
            </div>
          </div>

        </aside>

        <div class="requests__main">
          <div class="requests__list" id="requestsList" role="list"></div>
          <p class="requests__empty" id="requestsEmpty" hidden>No requests match the selected filters.</p>
        </div>

      </div>


    </section>

  </div>
</main>

<!-- ================================================================
     PAYMENT CONFIRMATION
================================================================ -->
<dialog class="modal" id="payModal" aria-labelledby="payTitle">
  <div class="modal__panel">

    <div class="modal__head">
      <span class="modal__icon">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10.5h18"/><path d="M6.5 15h3"/></svg>
      </span>
      <button class="modal__close" type="button" id="payClose" aria-label="Close">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
      </button>
    </div>

    <h2 class="modal__title" id="payTitle">Confirm your payment</h2>
    <p class="modal__context" id="payContext"></p>

    <div class="modal__summary">
      <div class="modal__row">
        <span class="modal__row-label">Upgrade price</span>
        <span class="modal__row-value" id="payPrice"></span>
      </div>
      <div class="modal__row modal__row--total">
        <span class="modal__row-label">Charged today</span>
        <span class="modal__row-value" id="payTotal"></span>
      </div>
    </div>

    <p class="modal__card" id="payCard"></p>

    <p class="modal__note">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5.5c0 4-2.9 7.6-7 8.5-4.1-.9-7-4.5-7-8.5V6z"/><path d="M9.2 12.2l2 2 3.6-3.8"/></svg>
      <span id="payNote"></span>
    </p>

    <div class="modal__actions">
      <button class="modal__cancel" type="button" id="payCancel">Cancel</button>
      <button class="modal__confirm" type="button" id="payConfirm"></button>
    </div>

  </div>
</dialog>

<div class="visually-hidden" aria-live="polite" id="liveRegion"></div>

<script src="js/icons.js"></script>
<script src="js/popup.js"></script>
<script src="js/header.js"></script>
<script src="js/my-requests.js"></script>
</body>
</html>
