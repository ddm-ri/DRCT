<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My requests — Altitude</title>
  <meta name="description" content="Altitude — manage your upgrade and promo code requests in one place.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/my-requests.css">
</head>
<body>

<!-- ================================================================
     HEADER
================================================================ -->
<header class="alt-header" id="altHeader" data-page="requests"></header>

<!-- ================================================================
     MY REQUESTS
================================================================ -->
<main class="alt-main">
  <div class="alt-container">

    <section class="requests" aria-labelledby="requestsTitle">

      <h1 class="requests__title" id="requestsTitle">My requests</h1>

      <!-- Controls: request type (tabs) + request status (dropdown) -->
      <div class="requests__controls">

        <div class="segmented" role="tablist" aria-label="Request type" id="typeTabs">
          <button class="segmented__tab is-active" type="button" role="tab" aria-selected="true" data-type="all">
            All <span class="segmented__count" data-count="all">0</span>
          </button>
          <button class="segmented__tab" type="button" role="tab" aria-selected="false" data-type="upgrade">
            Upgrades <span class="segmented__count" data-count="upgrade">0</span>
          </button>
          <button class="segmented__tab" type="button" role="tab" aria-selected="false" data-type="promo">
            Promo codes <span class="segmented__count" data-count="promo">0</span>
          </button>
        </div>

        <div class="statusfilter" id="statusFilter">
          <button class="statusfilter__button" type="button" id="statusFilterButton"
                  aria-haspopup="listbox" aria-expanded="false">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M7 12h10"/><path d="M10 17h4"/></svg>
            <span class="statusfilter__label" id="statusFilterLabel">All statuses</span>
            <svg class="ico ico--chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9.5l6 5.5 6-5.5"/></svg>
          </button>

          <ul class="statusfilter__menu" role="listbox" aria-label="Request status" id="statusFilterMenu" hidden>
            <li role="option" aria-selected="true"  data-status="all"><span>All statuses</span><svg class="ico ico--check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></li>
            <li role="option" aria-selected="false" data-status="progress"><span>In progress</span><svg class="ico ico--check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></li>
            <li role="option" aria-selected="false" data-status="action"><span>Action required</span><svg class="ico ico--check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></li>
            <li role="option" aria-selected="false" data-status="done"><span>Completed</span><svg class="ico ico--check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></li>
          </ul>
        </div>

      </div>

      <!-- Request list -->
      <div class="requests__list" id="requestsList" role="list"></div>

      <p class="requests__empty" id="requestsEmpty" hidden>No requests match the selected filters.</p>

    </section>

  </div>
</main>

<div class="visually-hidden" aria-live="polite" id="liveRegion"></div>

<script src="js/icons.js"></script>
<script src="js/popup.js"></script>
<script src="js/header.js"></script>
<script src="js/my-requests.js"></script>
</body>
</html>
